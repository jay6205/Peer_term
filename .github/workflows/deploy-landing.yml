name: Deploy Landing Page to EC2

on:
  push:
    branches: [main]
    paths:
      - 'peerterm-landing/**'
      - '.github/workflows/deploy-landing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'peerterm-landing/**'
  workflow_dispatch:

concurrency:
  group: deploy-landing-production
  cancel-in-progress: false

env:
  SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

jobs:
  # ════════════════════════════════════════════════════════════════
  # Validate – install, lint, HTML check, Vite build & output audit
  # ════════════════════════════════════════════════════════════════
  validate:
    name: Validate & Build Landing Page
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: peerterm-landing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: peerterm-landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Syntax & React Hook Lint ───────────────────────────────
      - name: Lint JS/JSX with ESLint
        run: npm run lint -- --max-warnings=0

      # ── HTML Validation ────────────────────────────────────────
      - name: Validate index.html with HTMLHint
        run: npx --yes htmlhint index.html

      # ── Production Bundle Build ────────────────────────────────
      - name: Build production bundle
        run: npm run build

      # ── Output Integrity Check ─────────────────────────────────
      - name: Verify build output files
        run: |
          test -s dist/index.html
          test -s dist/favicon.svg
          test -s dist/og-preview.png
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test "$(ls -1 dist/assets/*.js | wc -l)" -ge 1
          test "$(ls -1 dist/assets/*.css | wc -l)" -ge 1
          echo "✓ All required landing page build artifacts present"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: peerterm-landing-dist
          path: peerterm-landing/dist
          retention-days: 1

  # ════════════════════════════════════════════════════════════════
  # Deploy – only runs on push to main or manual trigger
  # ════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy Landing Page to EC2
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Download verified dist artifact
        uses: actions/download-artifact@v4
        with:
          name: peerterm-landing-dist
          path: dist

      # ── SSH Setup ──────────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      # ── Upload to staging dir, then atomically promote into Nginx root ──
      - name: Sync built assets to EC2 staging directory
        run: |
          ssh -i ~/.ssh/ec2_key $SSH_OPTS "${EC2_USER}@${EC2_HOST}" "mkdir -p /tmp/peerterm-landing-deploy"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ec2_key $SSH_OPTS" \
            dist/ \
            "${EC2_USER}@${EC2_HOST}:/tmp/peerterm-landing-deploy/"

      - name: Promote to /var/www/peerterm-landing and fix permissions
        run: |
          ssh -i ~/.ssh/ec2_key $SSH_OPTS "${EC2_USER}@${EC2_HOST}" bash -s <<'REMOTE'
            set -euo pipefail
            sudo mkdir -p /var/www/peerterm-landing
            sudo rsync -a --delete /tmp/peerterm-landing-deploy/ /var/www/peerterm-landing/
            sudo chmod -R a+rX /var/www/peerterm-landing
            rm -rf /tmp/peerterm-landing-deploy
          REMOTE

      # ── Post-Deploy Smoke Test ─────────────────────────────────
      - name: Verify live routes
        run: |
          STATUS_HOME=$(curl -s -o /dev/null -w "%{http_code}" https://peerterm.dhananjaybalekar.in/)
          STATUS_APP=$(curl -s -o /dev/null -w "%{http_code}" https://peerterm.dhananjaybalekar.in/connect/)
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://peerterm.dhananjaybalekar.in/?code=123456")
          echo "GET /               -> $STATUS_HOME"
          echo "GET /connect/       -> $STATUS_APP"
          echo "GET /?code=123456   -> $STATUS_CODE"
          test "$STATUS_HOME" = "200"
          test "$STATUS_APP" = "200"
          test "$STATUS_CODE" = "302"

      # ── Cleanup ───────────────────────────────────────────────
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key
