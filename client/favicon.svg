<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Dark rounded background for tab contrast -->
  <rect width="64" height="64" rx="14" fill="#0a0e17"/>

  <!-- Outer hexagon outline -->
  <polygon 
    points="32,8 53,20 53,44 32,56 11,44 11,20" 
    fill="none" 
    stroke="url(#grad)" 
    stroke-width="3.5" 
    stroke-linejoin="round"
  />

  <!-- Terminal prompt ">" -->
  <path 
    d="M23 25 L31 32 L23 39" 
    fill="none" 
    stroke="url(#grad)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Terminal cursor "_" -->
  <line 
    x1="35" y1="39" 
    x2="43" y2="39" 
    stroke="#38bdf8" 
    stroke-width="3.5" 
    stroke-linecap="round"
  />
</svg>
