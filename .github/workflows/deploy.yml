name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'relay/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

jobs:
  # ════════════════════════════════════════════════════════════════
  # Validate – syntax, lint, HTML, dependency install
  # ════════════════════════════════════════════════════════════════
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Syntax Check ───────────────────────────────────────────
      - name: Syntax check all JS files
        run: |
          echo "── Checking relay/ ──"
          node --check relay/server.js

          echo "── Checking host/ ──"
          for f in host/bin/*.js host/src/*.js; do
            echo "  $f"
            node --check "$f"
          done

          echo "── Checking client/ ──"
          node --check client/app.js

          echo "✓ All syntax checks passed"

      # ── ESLint ─────────────────────────────────────────────────
      - name: Install ESLint
        run: npm install --no-save eslint @eslint/js

      - name: Lint with ESLint
        run: npx eslint relay/ host/ client/

      # ── HTML Validation ────────────────────────────────────────
      - name: Install htmlhint
        run: npm install --no-save htmlhint

      - name: Validate HTML
        run: npx htmlhint client/index.html

      # ── Dependency Install Check ───────────────────────────────
      - name: Verify relay dependencies install
        run: |
          cd relay
          npm install --omit=dev
          echo "✓ relay/ dependencies OK"

      - name: Verify host dependencies install
        run: |
          cd host
          npm install --omit=dev
          echo "✓ host/ dependencies OK"

  # ════════════════════════════════════════════════════════════════
  # Deploy – only runs after validate passes
  # ════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy PeerTerm
    needs: validate
    runs-on: ubuntu-latest

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      RELAY_DIR: /home/ubuntu/peerterm-relay

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── SSH Setup ──────────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      # ── Deploy Static Client ──────────────────────────────────
      - name: Sync client files to Nginx root
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ec2_key $SSH_OPTS" \
            client/index.html client/app.js client/styles.css \
            "${EC2_USER}@${EC2_HOST}:/var/www/peerterm/"

      # ── Deploy Relay Server ───────────────────────────────────
      - name: Sync relay files
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/ec2_key $SSH_OPTS" \
            relay/server.js relay/package.json \
            "${EC2_USER}@${EC2_HOST}:${RELAY_DIR}/"

      - name: Install dependencies and reload PM2
        run: |
          ssh -i ~/.ssh/ec2_key $SSH_OPTS "${EC2_USER}@${EC2_HOST}" bash -s <<'REMOTE'
            set -euo pipefail
            cd /home/ubuntu/peerterm-relay
            npm install --omit=dev
            pm2 reload peerterm-relay 2>/dev/null || pm2 start server.js --name peerterm-relay
            pm2 save
          REMOTE

      # ── Cleanup ───────────────────────────────────────────────
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key
